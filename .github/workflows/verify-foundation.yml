name: Verify Aether Code Vault
on:
  push:
    branches: [main, feature/complete-code-vault-foundation, feature/code-vault-next-pass]
  pull_request:
    branches: [main, feature/complete-code-vault-foundation]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install
      - run: bun run build
      - run: bun run lint
